name: Build OneCloud with OpenClash

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - build-onecloud

permissions:
  contents: read

concurrency:
  group: onecloud-openclash
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  OPENWRT_REPOSITORY: https://github.com/openwrt/openwrt.git
  OPENWRT_REF: v25.12.5
  TARGET: amlogic_meson8b

jobs:
  build:
    name: Build amlogic_meson8b
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Free disk space
        uses: coder-xiaomo/free-disk-space@20bfc7937f5519190924e19e80c2061d03743e01
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils aria2 bash binutils build-essential bzip2 ccache clang curl device-tree-compiler \
            file flex g++ g++-multilib gawk gcc-multilib gettext git jq libelf-dev \
            libfuse-dev libgmp3-dev liblzma-dev libmpc-dev libncurses5-dev libpython3-dev \
            libssl-dev llvm ninja-build patch pigz python3 python3-pyelftools \
            python3-setuptools qemu-utils rename rsync subversion swig unzip wget xsltproc \
            zlib1g-dev zstd
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          df -hT

      - name: Clone OpenWrt source
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$OPENWRT_REF" "$OPENWRT_REPOSITORY" openwrt
          git -C openwrt rev-parse HEAD

      - name: Move build directories
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/openwrt/build_dir /mnt/openwrt/dl /mnt/openwrt/staging_dir
          sudo chown -R "$USER":"$(id -gn)" /mnt/openwrt
          ln -s /mnt/openwrt/build_dir openwrt/build_dir
          ln -s /mnt/openwrt/dl openwrt/dl
          ln -s /mnt/openwrt/staging_dir openwrt/staging_dir

      - name: Load feeds and OneCloud target
        shell: bash
        run: |
          set -euo pipefail

          git_clone_path() {
            local source_ref="$1"
            local source_url="$2"
            local copy_mode="copy"
            local root_dir="$PWD"
            local temporary_dir
            shift 2

            if [[ "${1:-}" == "mv" ]]; then
              copy_mode="merge"
              shift
            fi

            [[ "$#" -gt 0 ]] || {
              echo "git_clone_path: missing sparse path" >&2
              return 1
            }

            temporary_dir="$(mktemp -d)"
            if [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]; then
              git clone --filter=blob:none --sparse "$source_url" "$temporary_dir"
              git -C "$temporary_dir" checkout "$source_ref"
            else
              git clone --depth=1 --filter=blob:none --sparse \
                --branch "$source_ref" "$source_url" "$temporary_dir"
            fi

            git -C "$temporary_dir" sparse-checkout set "$@"

            local sparse_path
            for sparse_path in "$@"; do
              [[ -e "$temporary_dir/$sparse_path" ]] || {
                echo "Missing path $sparse_path in $source_url@$source_ref" >&2
                return 1
              }

              mkdir -p "$(dirname "$root_dir/$sparse_path")"
              if [[ "$copy_mode" == "merge" ]]; then
                mkdir -p "$root_dir/$sparse_path"
                cp -a -n "$temporary_dir/$sparse_path/." "$root_dir/$sparse_path/"
              else
                cp -a -n "$temporary_dir/$sparse_path" "$root_dir/$sparse_path"
              fi
            done

            rm -rf "$temporary_dir"
          }
          export -f git_clone_path

          cp -a devices openwrt/devices
          cd openwrt
          cp -a "devices/common/." ./
          cp -a "devices/$TARGET/." ./

          bash "devices/common/diy.sh"

          cp "devices/common/.config" .config
          printf '\n' >> .config
          cat "devices/$TARGET/.config" >> .config

          bash "devices/$TARGET/diy.sh"
          if [[ -d diy ]]; then
            cp -a diy/. ./
          fi

          test -f package/openclash/luci-app-openclash/Makefile
          test -f target/linux/amlogic/image/meson8b.mk

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          cp -a -n devices/common/patches/. "devices/$TARGET/patches/"

          while IFS= read -r -d '' patch_file; do
            git apply "$patch_file"
          done < <(find "devices/$TARGET/patches" -maxdepth 1 -type f \
            -name '*.bin.patch' -print0 | sort -z)

          while IFS= read -r -d '' patch_file; do
            patch -d . -R --batch --forward --no-backup-if-mismatch -p1 -F 1 < "$patch_file"
          done < <(find "devices/$TARGET/patches" -maxdepth 1 -type f \
            -name '*.revert.patch' -print0 | sort -z)

          while IFS= read -r -d '' patch_file; do
            patch -d . --batch --forward --no-backup-if-mismatch -p1 -F 1 < "$patch_file"
          done < <(find "devices/$TARGET/patches" -maxdepth 1 -type f \
            -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' \
            -print0 | sort -z)

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          make defconfig

          required_options=(
            CONFIG_TARGET_amlogic=y
            CONFIG_TARGET_amlogic_meson8b=y
            CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
            CONFIG_PACKAGE_luci-app-openclash=y
            CONFIG_PACKAGE_dnsmasq-full=y
            CONFIG_PACKAGE_kmod-tun=y
            CONFIG_PACKAGE_ruby=y
            CONFIG_PACKAGE_ruby-yaml=y
            CONFIG_PACKAGE_luci-theme-bootstrap=y
            CONFIG_PACKAGE_uhttpd=y
            CONFIG_PACKAGE_uhttpd-mod-ubus=y
          )

          for option in "${required_options[@]}"; do
            grep -Fqx "$option" .config || {
              echo "Required configuration is missing: $option" >&2
              exit 1
            }
          done

          if grep -Eq '^CONFIG_PACKAGE_(luci-nginx|nginx|nginx-ssl)=y$' .config; then
            echo "nginx must be disabled" >&2
            exit 1
          fi

          defaults_file="package/base-files/files/etc/uci-defaults/99-onecloud-bypass-router"
          test -x "$defaults_file"
          grep -Fq "set network.lan.ipaddr='192.168.3.7'" "$defaults_file"
          grep -Fq "set network.lan.netmask='255.255.255.0'" "$defaults_file"
          grep -Fq "set network.lan.gateway='192.168.3.2'" "$defaults_file"
          grep -Fq "set dhcp.lan.ignore='1'" "$defaults_file"

          ./scripts/diffconfig.sh

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          make download -j8

          incomplete_downloads="$(find dl -type f -size -1024c -print)"
          if [[ -n "$incomplete_downloads" ]]; then
            echo "Incomplete downloads detected:" >&2
            printf '%s\n' "$incomplete_downloads" >&2
            exit 1
          fi

      - name: Compile firmware
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          echo "Compiling with $(nproc) jobs"
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify and package firmware
        shell: bash
        run: |
          set -euo pipefail
          target_dir="openwrt/bin/targets/amlogic/meson8b"
          artifact_dir="$GITHUB_WORKSPACE/artifact"

          manifest="$(find "$target_dir" -maxdepth 1 -type f -name '*onecloud.manifest' -print -quit)"
          image="$(find "$target_dir" -maxdepth 1 -type f \
            \( -name '*onecloud*emmc_burn.img' -o -name '*onecloud*emmc_burn.img.gz' \) \
            -print -quit)"

          [[ -n "$manifest" && -f "$manifest" ]] || {
            echo "OneCloud manifest was not generated" >&2
            exit 1
          }
          [[ -n "$image" && -f "$image" ]] || {
            echo "OneCloud eMMC burn image was not generated" >&2
            exit 1
          }
          if [[ ! "$(basename "$image")" =~ ^kwrt-[0-9]{2}\.[0-9]{2}\.[0-9]{4}-amlogic-meson8b-thunder-onecloud-ext4-emmc_burn\.img(\.gz)?$ ]]; then
            echo "Unexpected burn image filename: $(basename "$image")" >&2
            exit 1
          fi

          validation_image="$image"
          if [[ "$image" == *.gz ]]; then
            validation_image="$RUNNER_TEMP/onecloud-emmc-burn.img"
            gzip -cd "$image" > "$validation_image"
          fi
          header="$(od -An -tx1 -j4 -N8 "$validation_image" | tr -d '[:space:]')"
          if [[ "$header" != "020000005619b527" ]]; then
            echo "Invalid Amlogic USB Burning Tool image header: $header" >&2
            exit 1
          fi
          grep -Eq '^luci-app-openclash[[:space:]]' "$manifest" || {
            echo "OpenClash is missing from the firmware manifest" >&2
            exit 1
          }
          grep -Eq '^uhttpd[[:space:]]' "$manifest" || {
            echo "uhttpd is missing from the firmware manifest" >&2
            exit 1
          }
          if grep -Eq '^(luci-nginx|nginx|nginx-ssl)[[:space:]]' "$manifest"; then
            echo "nginx must not be included in this firmware" >&2
            exit 1
          fi

          mkdir -p "$artifact_dir"
          cp "$manifest" "$artifact_dir/"
          cp openwrt/.config "$artifact_dir/amlogic_meson8b.config"

          kernel_config="$(find openwrt/build_dir -path '*/linux-6.12*/.config' -print -quit)"
          if [[ -n "$kernel_config" && -f "$kernel_config" ]]; then
            cp "$kernel_config" "$artifact_dir/amlogic_meson8b_kernel.config"
          fi

          if [[ "$image" == *.gz ]]; then
            cp "$image" "$artifact_dir/"
          else
            pigz -9 -c "$image" > "$artifact_dir/$(basename "$image").gz"
          fi

          find "$target_dir" -maxdepth 1 -type f -name '*onecloud*rootfs.tar.gz' \
            -exec cp {} "$artifact_dir/" \;

          (
            cd "$artifact_dir"
            sha256sum -- * > SHA256SUMS
          )
          ls -lh "$artifact_dir"

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onecloud-openclash-${{ env.OPENWRT_REF }}-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
